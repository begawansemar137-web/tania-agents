services:
  tania-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tania-agents-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3030}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MODELHUB_API_KEY=${MODELHUB_API_KEY}
      - MODELHUB_BASE_URL=${MODELHUB_BASE_URL:-https://api-modelhub.aiplayground.id/v1}
      - MODELHUB_DEFAULT_MODEL=${MODELHUB_DEFAULT_MODEL}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-1e894b01-b0d3-4e42-adf7-19288728a2c7}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:-tania-secret-key-telkom-agentic-32chars!}
      - DATA_DIR=/app/data
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - tania_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  tania-runner:
    image: node:22-alpine
    container_name: tania-agents-runner
    restart: unless-stopped
    working_dir: /app/runner
    environment:
      - DATA_DIR=/app/data
      - MODELHUB_API_KEY=${MODELHUB_API_KEY}
      - MODELHUB_BASE_URL=${MODELHUB_BASE_URL:-https://api-modelhub.aiplayground.id/v1}
    volumes:
      - tania_data:/app/data
    command: ["sh", "-c", "echo 'TANIA Agent Runner background worker initialized.' && while true; do sleep 3600; done"]

volumes:
  tania_data:
    name: tania_agents_data

